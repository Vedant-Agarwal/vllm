name: verify-firered
on:
  push:
    branches: [fix-firered-funasr-transformers-v5]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Build vLLM CPU from source
        run: |
          uv venv
          uv pip install setuptools setuptools_rust setuptools_scm wheel ninja cmake packaging
          uv pip install -r requirements/cpu.txt --index-strategy unsafe-best-match
          VLLM_TARGET_DEVICE=cpu uv pip install -e . --no-build-isolation
          uv pip install pytest kaldi-native-fbank tblib pytest-forked
      - name: FireRed/FunASR initialization tests
        run: |
          .venv/bin/python -m pytest \
            "tests/models/test_initialization.py::test_can_initialize_large_subset[FireRedASR2ForConditionalGeneration]" \
            "tests/models/test_initialization.py::test_can_initialize_large_subset[FireRedLIDForConditionalGeneration]" \
            "tests/models/test_initialization.py::test_can_initialize_large_subset[FunASRForConditionalGeneration]" -v
      - name: FireRed/FunASR processing tests
        run: |
          .venv/bin/python -m pytest tests/models/multimodal/processing/test_common.py -k "FireRedASR2 or FireRedLID or Fun-ASR" -v
