name: verify-firered
on:
  push:
    branches: [fix-firered-funasr-transformers-v5]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        model: [FireRedASR2ForConditionalGeneration, FireRedLIDForConditionalGeneration, FunASRForConditionalGeneration]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install system deps
        run: sudo apt-get update -q && sudo apt-get install -y -q libnuma-dev
      - name: Build vLLM CPU from source
        run: |
          uv venv
          uv pip install setuptools setuptools_rust setuptools_scm wheel ninja cmake packaging
          uv pip install -r requirements/cpu.txt --index-strategy unsafe-best-match
          VLLM_TARGET_DEVICE=cpu uv pip install -e . --no-build-isolation
          uv pip install pytest kaldi-native-fbank tblib pytest-forked
      - name: Init test (${{ matrix.model }})
        run: |
          .venv/bin/python -m pytest \
            "tests/models/test_initialization.py::test_can_initialize_large_subset[${{ matrix.model }}]" -v
      - name: Processing tests (${{ matrix.model }})
        if: always()
        run: |
          .venv/bin/python -m pytest tests/models/multimodal/processing/test_common.py -k "${{ matrix.model }}" -v || \
          .venv/bin/python -m pytest tests/models/multimodal/processing/test_common.py -k "FireRedASR2 or FireRedLID or Fun-ASR" --collect-only -q | head -5
